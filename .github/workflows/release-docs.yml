name: Publicar Release de Documentacao

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  sync-release:
    name: Sincronizar Release e Changelog no GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Extrair Notas da Versao do CHANGELOG.md
        run: |
          python3 -c "
          import os, re
          tag = os.environ.get('GITHUB_REF_NAME', '')
          ver = tag.lstrip('v')
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()
          pattern = rf'## \[v?{re.escape(ver)}\].*?(?=(?:\n## \[|\Z))'
          match = re.search(pattern, content, re.DOTALL)
          notes = match.group(0).strip() if match else f'# Release {tag}'
          repo = os.environ.get('GITHUB_REPOSITORY', '')
          notes += f'\n\n---\n**Full Changelog**: https://github.com/{repo}/commits/{tag}'
          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
              out.write(notes)
          "

      - name: Publicar ou Atualizar GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" && gh release edit "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md || gh release create "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --title "$GITHUB_REF_NAME - Baseline de Documentacao e Governanca"
